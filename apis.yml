name: UplinkSwitch
image: https://uplinkswitch.ai/opengraph-image
description: UplinkSwitch provides a resold LLM gateway offering uncensored models below list price. It operates a platform at uplinkswitch.ai
  that aggregates multiple large language model providers, enabling developers to access a variety of models via a unified API. The service includes
  features such as rate limiting, usage analytics, and flexible pricing plans. UplinkSwitch aims to simplify integration of advanced AI capabilities
  into applications while maintaining transparency and compliance with industry standards.
